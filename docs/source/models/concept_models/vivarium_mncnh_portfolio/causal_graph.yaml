    deterministic: true
    values: [not_anemic, mild, moderate, severe]
    kind: outcome
    caused_by:
      - postpartum_hemoglobin_nine_months
      - maternal_age_at_end_of_pregnancy

  # ---- anemia_ylds ----
  # "Anemia status" is not one variable. The module accrues anemia YLDs over five
  # windows, each with its own hemoglobin value, its own anemia status and its own
  # duration, and both observers stratify by anemia status AND timestep. So there
  # is one status per window, each a deterministic relabelling of the hemoglobin
  # value that window integrates over, and one YLD contribution per window here.
  #
  # The statuses themselves are declared beside the hemoglobin values they
  # relabel, since that is where they are assigned: `hemoglobin_start`,
  # `anemia_screening` (which also draws the ferritin result against it),
  # `hemoglobin_later` and `postpartum_hemoglobin`.
  #
  # The windows are: conception to the first trimester ANC visit, that visit to
  # the later ANC visit, that visit to the end of pregnancy, the first six weeks
  # after pregnancy, and the 34 weeks after that. The first two accrue nothing for
  # a simulant who did not attend the visit that closes them -- their time is
  # picked up by the third window instead, which is why attendance and both visit
  # timings are parents of all three. The last two accrue nothing for a simulant
  # who did not survive labour.

  # Visit timing sets the window boundaries.
  - name: first_trimester_anc_timing
    label: "First trimester ANC timing"
    caused_by:
      # Sampled against the PRE-intervention gestational age, which the module
      # calls a modeling convenience.
      - pregnancy_duration_unmodified_by_interventions
  - name: later_anc_timing
    label: "Later ANC timing"
    caused_by:
      # Sampled against the gestational age as it stands at the later visit:
      # modified by first trimester interventions, not by later ones.
      - pregnancy_duration_unmodified_by_later_anc_interventions

  - name: anemia_ylds_to_first_trimester_anc
    label: "Anemia YLDs to first trimester ANC"
    deterministic: true
    caused_by:
      - anemia_status_at_the_start_of_pregnancy
      - first_trimester_anc_attendance
      - first_trimester_anc_timing

  - name: anemia_ylds_between_anc_visits
    label: "Anemia YLDs between ANC visits"
    deterministic: true
    caused_by:
      - anemia_status_after_first_trimester_anc_visit
      - anc_attendance_category
      - first_trimester_anc_timing
      - later_anc_timing

  - name: anemia_ylds_to_end_of_pregnancy
    label: "Anemia YLDs to end of pregnancy"
    deterministic: true
    caused_by:
      - anemia_status_at_end_of_pregnancy
      - anc_attendance_category
      - first_trimester_anc_timing
      - later_anc_timing
      - pregnancy_duration

  # Both postpartum windows accrue nothing for a simulant who did not survive
  # labour. That is a rule about the YLD update, not only about the hemoglobin
  # value being missing, so maternal mortality is a parent here in its own right.
  - name: anemia_ylds_first_six_weeks_postpartum
    label: "Anemia YLDs in the first six weeks postpartum"
    deterministic: true
    caused_by:
      - anemia_status_first_six_weeks_postpartum
      - maternal_mortality

  # The only window scored against NON-pregnancy anemia thresholds.
  - name: anemia_ylds_six_weeks_to_nine_months
    label: "Anemia YLDs six weeks to nine months postpartum"
    deterministic: true
    caused_by:
      - anemia_status_six_weeks_to_nine_months
      - maternal_mortality

  # The observer writes the five windows separately, stratified by timestep; this
  # is their sum, which is the quantity the results report. `observed` sits here
  # rather than on the five, which are rows of this one measure rather than five
  # measures of their own.
  - name: anemia_ylds
    label: "Anemia YLDs"
    deterministic: true
    kind: outcome
    caused_by:
      - anemia_ylds_to_first_trimester_anc
      - anemia_ylds_between_anc_visits
      - anemia_ylds_to_end_of_pregnancy
      - anemia_ylds_first_six_weeks_postpartum
      - anemia_ylds_six_weeks_to_nine_months

  # ---- postpartum_depression ----
  - name: postpartum_depression
    kind: outcome
    caused_by:
      - hemoglobin_at_end_of_pregnancy
      - maternal_mortality


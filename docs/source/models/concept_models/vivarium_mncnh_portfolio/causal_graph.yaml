  # The residual category of the all-cause mortality risk: everything left after
  # the three modelled subcauses. It has two LBWSG parents because it mixes two
  # kinds of cause. Causes LBWSG affects but the simulation does not model (SIDS,
  # jaundice, diarrhoeal disease) take the modified exposure, since their risk
  # really does move with it. Causes LBWSG does not affect (congenital anomalies)
  # take the unmodified exposure, keeping their well-measured correlation with
  # birth size without letting an intervention appear to prevent them.
  - name: neonatal_other_causes_mortality_enn

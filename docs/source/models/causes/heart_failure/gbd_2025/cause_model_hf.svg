<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Susceptible state -->
  <rect x="60" y="180" width="180" height="90" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="150" y="218" text-anchor="middle" font-weight="bold">S</text>
  <text x="150" y="242" text-anchor="middle">Susceptible to HF</text>

  <!-- HF ischemic state -->
  <rect x="540" y="70" width="220" height="90" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="650" y="106" text-anchor="middle" font-weight="bold">HF_I</text>
  <text x="650" y="130" text-anchor="middle">Heart failure, ischemic</text>

  <!-- HF non-ischemic state -->
  <rect x="540" y="300" width="220" height="90" rx="8" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="650" y="336" text-anchor="middle" font-weight="bold">HF_NI</text>
  <text x="650" y="360" text-anchor="middle">Heart failure, non-ischemic</text>

  <!-- T1: S -> HF_I -->
  <line x1="240" y1="200" x2="535" y2="125" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="368" y="150" text-anchor="middle">T1: i_I(a,s)</text>

  <!-- T2: S -> HF_NI -->
  <line x1="240" y1="250" x2="535" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="320" text-anchor="middle">T2: i_NI(a,s)</text>

  <!-- Optional IHD-HF coupling component -->
  <rect x="60" y="22" width="330" height="106" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="225" y="46" text-anchor="middle" fill="#555" font-weight="bold">Optional IHD-HF coupling component</text>
  <text x="225" y="66" text-anchor="middle" fill="#555">1. MI-history effect (exposure: IHD model's</text>
  <text x="225" y="84" text-anchor="middle" fill="#555">MI-history attribute) multiplies T1, PAF-renormalized</text>
  <text x="225" y="104" text-anchor="middle" fill="#555">2. reassigns HF-due-to-IHD deaths (nets the IHD EMR)</text>
  <line x1="340" y1="128" x2="382" y2="152" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- EF attribute overlay -->
  <rect x="560" y="185" width="180" height="80" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="650" y="213" text-anchor="middle" fill="#555">EF attribute drawn</text>
  <text x="650" y="235" text-anchor="middle" fill="#555">at state entry</text>
  <line x1="650" y1="185" x2="650" y2="165" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <line x1="650" y1="265" x2="650" y2="295" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>

  <!-- Caption -->
  <text x="60" y="425" fill="#555">HF_I and HF_NI are absorbing (no remission). Deaths occur from either HF state via EMR</text>
  <text x="60" y="445" fill="#555">from the GBD DisMod-AT fit of the HF envelope. This model owns all HF-attributable</text>
  <text x="60" y="465" fill="#555">deaths, and the coupling component reassigns the HF-due-to-IHD share from the IHD model.</text>
</svg>
